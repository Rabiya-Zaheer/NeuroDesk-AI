[package]
name = "neurodesk"
version = "0.1.0"
description = "NeuroDesk desktop shell — a native window around the NeuroDesk web app."
authors = ["NeuroDesk"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "neurodesk"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
